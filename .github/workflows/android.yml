name: Android CI

on:
  push:
    branches: [ "main", "arena/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests (kedua varian)
        run: |
          set +e
          set -o pipefail
          ./gradlew :app:testOfflineDebugUnitTest :app:testInkDebugUnitTest --stacktrace --console=plain 2>&1 | tee /tmp/unit-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            bash .github/scripts/report-gradle-failures.sh /tmp/unit-tests.log "unit test"
          fi
          exit "$status"

      - name: Laporan error lanjutan (bila gagal)
        if: failure()
        run: |
          for f in /tmp/unit-tests.log /tmp/build.log; do
            if [ -f "$f" ]; then
              bash .github/scripts/report-gradle-failures.sh "$f" "error lanjutan" 11
            fi
          done

      - name: Build APK (offline + ink, debug + release)
        run: |
          set +e
          set -o pipefail
          ./gradlew :app:assembleOfflineDebug :app:assembleOfflineRelease :app:assembleInkDebug :app:assembleInkRelease --stacktrace --console=plain 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            bash .github/scripts/report-gradle-failures.sh /tmp/build.log "build apk"
          fi
          exit "$status"

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          short="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/offline/debug/app-offline-debug.apk   "artifacts/Penboard-${short}-offline-debug.apk"   || true
          cp app/build/outputs/apk/offline/release/app-offline-release.apk "artifacts/Penboard-${short}-offline-release.apk" || true
          cp app/build/outputs/apk/ink/debug/app-ink-debug.apk           "artifacts/Penboard-${short}-ink-debug.apk"       || true
          cp app/build/outputs/apk/ink/release/app-ink-release.apk       "artifacts/Penboard-${short}-ink-release.apk"     || true
          ls -lh artifacts

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: penboard-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APKs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.apk
          generate_release_notes: true
